[mypy]
python_version = 3.12
mypy_path = src
explicit_package_bases = True
warn_return_any = True
warn_unused_configs = True
exclude = airdrops/venv/.*|venv/.*|\.venv/.*|src/airdrops_backup/.*
namespace_packages = True
strict = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-docutils.*]
ignore_missing_imports = True

[mypy-airdrops.shared.recovery_manager]
ignore_missing_imports = True

[mypy-airdrops.shared.state_manager]
ignore_missing_imports = True

[mypy-airdrops.shared.gas_manager]
ignore_missing_imports = True

[mypy-airdrops.shared.protocol_manager]
ignore_missing_imports = True

[mypy-airdrops.shared.circuit_breaker]
ignore_missing_imports = True