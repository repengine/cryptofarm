[tool.poetry]
name = "cryptofarm"
version = "0.1.0"
description = "A unified project for airdrop farming."
authors = ["Your Name <you@example.com>"]
packages = [{include = "airdrops", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
web3 = "7.12.0"
eth-abi = ">=5.0.0,<6.0.0"
hyperliquid-python-sdk = "0.15.0"
solana = "^0.36.7"
python-dotenv = "1.1.0"
requests = "2.32.3"
pendulum = "3.1.0"
pytest-mock = ">=3.14.1,<4.0.0"
apscheduler = ">=3.10.0,<4.0.0"
numpy = ">=1.24.0,<2.0.0"
pandas = ">=2.0.0,<3.0.0"
prometheus-client = ">=0.20.0,<1.0.0"
psutil = ">=5.9.0,<6.0.0"
pyyaml = ">=6.0.0,<7.0.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.32.0,<1.0.0"
sqlalchemy = ">=2.0.0,<3.0.0"
pydantic = ">=2.0.0,<3.0.0"
redis = ">=6.2.0,<7.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pytest = "^8.0.0"
ruff = "^0.11.12"
pytest-mock = "^3.14.1"
pandas-stubs = "^2.0.0"
sphinx = "^7.0.0"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^2.0.0"
coverage = "^7.0.0"
pytest-cov = "^4.0.0"
hypothesis = "^6.135.2"
types-psutil = "^7.0.0.20250601"
types-pyyaml = "^6.0.12.20250516"
web3 = "^7.12.0"
eth-account = "^0.13.7"
pendulum = "^3.1.0"
eth-abi = "^5.2.0"
solana = "^0.36.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src/airdrops --cov-report=html --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/airdrops"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/abi/*",
    "*/config/*"
]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# Run Ruff on all files in the `src` and `tests` directories.
src = ["src", "tests"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache",
    ".nox", ".pants.d", ".ruff_cache", ".svn", ".tox", ".venv",
    "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "venv",
]